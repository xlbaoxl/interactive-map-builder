name: apply v0.3.2 patch

on:
  push:
    branches:
      - agent/v0.3.2-controls-and-updates
    paths:
      - ".github/workflows/apply-v032.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.3.2-controls-and-updates
          fetch-depth: 0
      - name: Apply the reviewed v0.3.2 tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v032-patch/part-* | base64 -d | gzip -d > /tmp/v0.3.2.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index --binary /tmp/v0.3.2.patch
          git rm -r .github/v032-patch
          git rm .github/workflows/apply-v032.yml
          git commit -m "release: prepare v0.3.2 controls and safe updates"
          git push origin HEAD:agent/v0.3.2-controls-and-updates

# Touching this workflow after it exists on the branch intentionally starts the one-shot apply job.
