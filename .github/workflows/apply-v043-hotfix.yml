name: apply-v043-hotfix

on:
  push:
    branches:
      - hotfix/v0.4.3-update-preflight
    paths:
      - .hotfix-payload/**
      - .github/workflows/apply-v043-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.4.3-update-preflight
          fetch-depth: 0

      - name: Verify and apply payload
        shell: bash
        run: |
          set -euo pipefail
          cat .hotfix-payload/part-* > /tmp/imb-v043.b64
          base64 --decode /tmp/imb-v043.b64 > /tmp/imb-v043.tar.gz
          echo "3cd2eac2b534b57c1fd94af33d8d997c5f8af49a789da10c4d20fd3df249ba7d  /tmp/imb-v043.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/imb-v043.tar.gz
          tar -xzf /tmp/imb-v043.tar.gz -C .
          rm -rf .hotfix-payload

      - name: Commit applied hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release v0.4.3: repair update preflight"
          git push origin HEAD:hotfix/v0.4.3-update-preflight
