name: Apply v0.4.3 hotfix payload

on:
  push:
    branches:
      - hotfix/v0.4.3-update-preflight
    paths:
      - ".github/workflows/apply-v043-hotfix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.4.3-update-preflight
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .hotfix-payload/part-* > /tmp/imb-hotfix-v043.b64
          base64 --decode /tmp/imb-hotfix-v043.b64 > /tmp/imb-hotfix-v043.tar.gz
          echo "3cd2eac2b534b57c1fd94af33d8d997c5f8af49a789da10c4d20fd3df249ba7d  /tmp/imb-hotfix-v043.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/imb-hotfix-extract
          tar -xzf /tmp/imb-hotfix-v043.tar.gz -C /tmp/imb-hotfix-extract
          rm -f /tmp/imb-hotfix-extract/.github/workflows/release.yml
          cp -a /tmp/imb-hotfix-extract/. .
          rm -rf .hotfix-payload

      - name: Run focused hotfix tests
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'version = "0.4.3"' pyproject.toml
          python -m py_compile scripts/update_skill.py scripts/mapcore/version.py
          python -m pip install --disable-pip-version-check -q pytest requests
          PYTHONPATH=scripts python -m pytest -q tests/test_update_skill.py

      - name: Commit reconstructed hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconstructed changes were produced." >&2
            exit 1
          fi
          git commit -m "Hotfix v0.4.3 update preflight"
          git push origin HEAD:hotfix/v0.4.3-update-preflight
