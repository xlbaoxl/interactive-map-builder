name: apply-v043-hotfix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".hotfix-payload/**"
      - ".github/workflows/apply-v043-hotfix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.4.3-update-preflight
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .hotfix-payload/part-* | base64 --decode > /tmp/imb-hotfix-v043.tar.gz
          echo "3cd2eac2b534b57c1fd94af33d8d997c5f8af49a789da10c4d20fd3df249ba7d  /tmp/imb-hotfix-v043.tar.gz" | sha256sum -c -
          tar -xzf /tmp/imb-hotfix-v043.tar.gz
          rm -rf .hotfix-payload

      - name: Validate reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_skill.py scripts/mapcore/version.py \
            tests/test_update_skill.py tests/test_cli_integration.py tests/test_distribution.py
          python - <<'PY'
          from pathlib import Path
          assert 'version = "0.4.3"' in Path('pyproject.toml').read_text(encoding='utf-8')
          assert '## [0.4.3]' in Path('CHANGELOG.md').read_text(encoding='utf-8')
          PY
          git status --short

      - name: Commit reconstructed hotfix
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden v0.4.3 update preflight"
          git push origin HEAD:hotfix/v0.4.3-update-preflight
