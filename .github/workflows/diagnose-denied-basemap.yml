name: diagnose-denied-basemap
on:
  push:
    branches: [agent/basemap-local-html]
    paths: [.github/workflows/diagnose-denied-basemap.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Record synthetic map state during rejected style request
        run: |
          python - <<'PY'
          import json, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'tests');sys.path.insert(0, 'scripts')
          from test_basemap_delivery import _build
          from playwright.sync_api import sync_playwright
          out=Path('/tmp/denied-basemap');out.mkdir()
          with tempfile.TemporaryDirectory() as temp, sync_playwright() as p:
              path=_build(Path(temp))
              browser=p.chromium.launch(headless=True,args=['--enable-unsafe-swiftshader'])
              context=browser.new_context()
              events=[];states=[]
              def deny(route):
                  events.append({'denied':route.request.url})
                  route.fulfill(status=403,body='Denied')
              context.route('https://**',deny)
              page=context.new_page()
              page.on('pageerror',lambda e:events.append({'pageerror':str(e)}))
              page.on('console',lambda m:events.append({'console':m.type,'text':m.text}))
              try:
                  page.goto(path.as_uri())
                  page.wait_for_function('window.__interactiveMapBuilderQA && window.__interactiveMapBuilderQA.ready')
                  for delay in [0,1000,4000,16000,1000]:
                      page.wait_for_timeout(delay)
                      states.append(page.evaluate('''() => {
                        const q=window.__interactiveMapBuilderQA;
                        let summary;try { summary=q.basemapSummary(); } catch(e) { summary=String(e); }
                        const message=document.getElementById('imb-map-message');
                        const selector=document.getElementById('imb-basemap-select');
                        return {status:q.basemapStatus,diagnostics:q.basemapDiagnostics,fallback:q.basemapFallback,
                          active:q.activeBasemap,errors:q.errors,summary,
                          message:message && message.textContent,selector:selector && selector.value,
                          canvases:document.querySelectorAll('.maplibregl-canvas').length};
                      }'''))
                      (out/'diagnosis.json').write_text(json.dumps({'states':states,'events':events},indent=2))
                  page.screenshot(path=str(out/'denied.png'))
              finally:
                  (out/'diagnosis.json').write_text(json.dumps({'states':states,'events':events},indent=2))
                  print(json.dumps({'states':states,'events':events},indent=2))
                  browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: denied-basemap-diagnosis
          path: /tmp/denied-basemap
          retention-days: 7
