name: basemap-vendor-review
on:
  push:
    branches: [agent/basemap-local-html]
    paths: [.github/workflows/basemap-vendor-review.yml]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch pinned npm assets and verify registry integrity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, tarfile, urllib.request
          from pathlib import Path
          packages = [
            ('maplibre-gl', '5.6.2', 'maplibre-gl-5.6.2', ['dist/maplibre-gl.js', 'dist/maplibre-gl.css', 'LICENSE.txt']),
            ('@maplibre/maplibre-gl-leaflet', '0.1.4', 'maplibre-gl-leaflet-0.1.4', ['leaflet-maplibre-gl.js', 'LICENSE']),
          ]
          root = Path('/tmp/imb-vendors'); root.mkdir()
          entries, records = [], []
          for package, version, folder, names in packages:
              with urllib.request.urlopen('https://registry.npmjs.org/' + package + '/' + version) as r:
                  info = json.load(r)
              assert info['version'] == version and info['name'] == package
              url = info['dist']['tarball']
              assert url.startswith('https://registry.npmjs.org/')
              data = urllib.request.urlopen(url).read()
              algorithm, expected = info['dist']['integrity'].split('-', 1)
              assert base64.b64encode(hashlib.new(algorithm, data).digest()).decode() == expected
              records.append({'package': package, 'version': version, 'url': url, 'integrity': info['dist']['integrity']})
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                  for name in names:
                      source = archive.extractfile('package/' + name)
                      assert source is not None, name
                      content = source.read()
                      path = 'scripts/mapcore/resources/vendor/' + folder + '/' + name.rsplit('/', 1)[-1]
                      out = root / path; out.parent.mkdir(parents=True, exist_ok=True); out.write_bytes(content)
                      request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                        data=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode(), method='POST',
                        headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
                      with urllib.request.urlopen(request) as r: result=json.load(r)
                      entries.append({'path': path, 'type': 'blob', 'mode': '100644', 'sha': result['sha'], 'bytes': len(content), 'sha256': hashlib.sha256(content).hexdigest()})
          (root/'vendor-review.json').write_text(json.dumps({'packages': records, 'entries': entries}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imb-pinned-basemap-vendors
          path: /tmp/imb-vendors
          retention-days: 7
