name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/evaluate_triggers.py validate
      - name: Run non-browser tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -m "not browser" 2>&1 | tee "pytest-${{ matrix.python-version }}.log"
      - name: Upload non-browser test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: warn
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -m browser 2>&1 | tee pytest-browser.log
      - name: Upload browser test log and README screenshot QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-browser
          path: |
            pytest-browser.log
            readme-screenshot-qa
          if-no-files-found: warn
          retention-days: 7

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run Windows path, package, and updater smoke tests
        run: >-
          python -m pytest -q
          tests/test_spec.py
          tests/test_loaders.py
          tests/test_cli_integration.py
          tests/test_delivery_transaction.py
          tests/test_safe_zip.py
          tests/test_update_skill.py
          tests/test_update_hotfix.py

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python scripts/build_skill_package.py
      - name: Install wheel in a clean environment and run the offline doctor
        run: |
          python -m venv /tmp/imb-wheel
          /tmp/imb-wheel/bin/python -m pip install --upgrade pip
          /tmp/imb-wheel/bin/python -m pip install --force-reinstall dist/*.whl
          /tmp/imb-wheel/bin/interactive-map-builder --version
          /tmp/imb-wheel/bin/interactive-map-builder doctor
      - name: Build outside the repository from the installed wheel
        run: |
          mkdir -p /tmp/imb-project
          cp -R assets/examples/csv-points/. /tmp/imb-project/
          cd /tmp
          /tmp/imb-wheel/bin/interactive-map-builder build \
            --spec /tmp/imb-project/map_spec.json \
            --out /tmp/imb-dist
          /tmp/imb-wheel/bin/interactive-map-builder verify --dist /tmp/imb-dist
          test -s /tmp/imb-dist/map.html
          test -s /tmp/imb-dist/build_report.json
          test -s /tmp/imb-dist/DELIVERY_MANIFEST.json
      - name: Verify the lean Skill archive
        run: |
          ls dist/interactive-map-builder-skill-v*.zip >/dev/null
          python - <<'PY'
          import zipfile
          from pathlib import Path

          archive = next(Path("dist").glob("interactive-map-builder-skill-v*.zip"))
          with zipfile.ZipFile(archive) as handle:
              names = set(handle.namelist())
          required = {
              "interactive-map-builder/SKILL.md",
              "interactive-map-builder/agents/openai.yaml",
              "interactive-map-builder/pyproject.toml",
              "interactive-map-builder/scripts/cli.py",
              "interactive-map-builder/scripts/map_builder.py",
              "interactive-map-builder/PACKAGE_MANIFEST.json",
          }
          assert required <= names
          assert not any("/tests/" in name or "/assets/" in name for name in names)
          PY
