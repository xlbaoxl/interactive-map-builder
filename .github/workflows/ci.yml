name: publish v0.3.2 non-workflow tree

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v032:
    if: github.head_ref == 'agent/v0.3.2-controls-and-updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - name: Commit the reviewed non-workflow v0.3.2 changes
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee /tmp/v032-apply.log) 2>&1
          set -euxo pipefail
          cat .github/v032-patch/part-* > /tmp/v0.3.2.patch.gz.b64
          test "$(wc -c < /tmp/v0.3.2.patch.gz.b64)" = "48968"
          echo "dac96f940d2e968372dc996ac7dc3a18d04a35731dab0c037e55d88903d1cd38  /tmp/v0.3.2.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v0.3.2.patch.gz.b64 > /tmp/v0.3.2.patch.gz
          echo "fa19f508697543fa59b33e947074abf8363008df48ce5a380784427e430863c1  /tmp/v0.3.2.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v0.3.2.patch.gz > /tmp/v0.3.2.patch
          echo "9ebcd009226e10e243e391701907d22b93a0ee5f1ce938e6cb7fdb9fe98335c3  /tmp/v0.3.2.patch" | sha256sum -c -

          git apply --check --index --binary --exclude='.github/workflows/*' /tmp/v0.3.2.patch
          git apply --index --binary --exclude='.github/workflows/*' /tmp/v0.3.2.patch
          git rm -r .github/v032-patch
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git diff --cached --check
          test "$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )" = "0.3.2"
          test -f scripts/update_skill.py
          test -f scripts/mapcore/basemaps.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: prepare v0.3.2 controls and safe updates"
          git push --verbose origin "HEAD:refs/heads/${{ github.head_ref }}"
      - name: Upload staging diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v032-apply-diagnostic
          path: /tmp/v032-apply.log
          retention-days: 1
      - name: Propagate staging failure
        if: steps.apply.outcome == 'failure'
        run: exit 1
