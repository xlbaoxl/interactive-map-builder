name: fix-v043-ci

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/fix-v043-ci.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.4.3-update-preflight
          fetch-depth: 0

      - name: Apply targeted compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          update_tests = Path("tests/test_update_skill.py")
          tests = update_tests.read_text(encoding="utf-8")
          old = '''def test_update_check_uses_network_then_24_hour_cache(tmp_path: Path):
              state = tmp_path / "state.json"
              session = FakeSession(_release("0.4.3"))'''
          new = '''def test_update_check_uses_network_then_24_hour_cache(tmp_path: Path):
              state = tmp_path / "state.json"
              session = FakeSession(_release("0.4.4"))'''
          if old not in tests:
              raise SystemExit("version-sensitive cache test block not found")
          tests = tests.replace(old, new, 1)
          tests = tests.replace(
              '    assert first["latest_version"] == "0.4.3"',
              '    assert first["latest_version"] == "0.4.4"',
              1,
          )
          update_tests.write_text(tests, encoding="utf-8")

          structure_tests = Path("tests/test_skill_structure.py")
          structure = structure_tests.read_text(encoding="utf-8")
          structure = structure.replace(
              '    assert "v0.4.1" in readme_en\n    assert "v0.4.1" in readme_zh',
              '    assert "v0.4.3" in readme_en\n    assert "v0.4.3" in readme_zh',
              1,
          )
          structure_tests.write_text(structure, encoding="utf-8")

          readme = Path("README.md")
          english = readme.read_text(encoding="utf-8")
          install_anchor = "Use one active Codex Skill directory rather than keeping duplicate `.codex` and `.agents` copies.\n"
          install_note = (
              install_anchor
              + "A legacy Windows location may be `$HOME\\.agents\\skills`; archive it before using the active Codex directory below.\n"
          )
          if install_anchor not in english:
              raise SystemExit("English manual-install anchor not found")
          english = english.replace(install_anchor, install_note, 1)
          status_anchor = (
              "JSON containing the local version, official version when known, source, installation type, and\n"
              "status.\n"
          )
          status_note = status_anchor + "For a cached status-only query, run `interactive-map-builder update --check`.\n"
          if status_anchor not in english:
              raise SystemExit("English update-status anchor not found")
          readme.write_text(english.replace(status_anchor, status_note, 1), encoding="utf-8")

          readme_zh = Path("README.zh-CN.md")
          chinese = readme_zh.read_text(encoding="utf-8")
          install_anchor_zh = "Codex 只保留一个活动 Skill 目录，避免 `.codex` 与 `.agents` 同时存在重复副本。\n"
          install_note_zh = (
              install_anchor_zh
              + "旧版 Windows 安装位置可能是 `$HOME\\.agents\\skills`；使用下方活动目录前先将其归档。\n"
          )
          if install_anchor_zh not in chinese:
              raise SystemExit("Chinese manual-install anchor not found")
          chinese = chinese.replace(install_anchor_zh, install_note_zh, 1)
          status_anchor_zh = "返回结构化 JSON，明确给出本地版本、可确认的官方版本、结果来源、安装类型和状态。\n"
          status_note_zh = status_anchor_zh + "仅需缓存状态查询时，运行 `interactive-map-builder update --check`。\n"
          if status_anchor_zh not in chinese:
              raise SystemExit("Chinese update-status anchor not found")
          readme_zh.write_text(chinese.replace(status_anchor_zh, status_note_zh, 1), encoding="utf-8")
          PY

      - name: Run focused compatibility suite
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --quiet -r requirements-dev.txt
          PYTHONPATH=scripts python -m pytest -q \
            tests/test_update_skill.py \
            tests/test_update_hotfix.py \
            tests/test_skill_structure.py 2>&1 | tee focused-v043.log

      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-v043
          path: focused-v043.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md tests/test_update_skill.py tests/test_skill_structure.py
          git commit -m "test: keep updater checks version-independent"
          git push origin HEAD:hotfix/v0.4.3-update-preflight
