name: refine-v043-hotfix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/refine-v043-hotfix.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.4.3-update-preflight
          fetch-depth: 0

      - name: Restore history and legacy test coverage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import subprocess
          from pathlib import Path

          branch_changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          start = branch_changelog.index("## [0.4.3]")
          end = branch_changelog.index("## [0.4.2]", start)
          release_block = branch_changelog[start:end].strip()

          main_changelog = subprocess.check_output(
              ["git", "show", "origin/main:CHANGELOG.md"], text=True
          )
          marker = "## [Unreleased] / 未发布\n"
          if marker not in main_changelog:
              raise SystemExit("Unreleased marker not found in main CHANGELOG")
          restored = main_changelog.replace(
              marker,
              marker + "\n" + release_block + "\n",
              1,
          )
          Path("CHANGELOG.md").write_text(restored, encoding="utf-8")

          readme = Path("README.md")
          english = readme.read_text(encoding="utf-8").replace(
              "The project is in **v0.4.3 beta**.",
              "The current stable release is **v0.4.3**.",
          )
          readme.write_text(english, encoding="utf-8")

          readme_zh = Path("README.zh-CN.md")
          chinese = readme_zh.read_text(encoding="utf-8").replace(
              "项目当前处于 **v0.4.3 Beta**。",
              "当前稳定版本为 **v0.4.3**。",
          )
          readme_zh.write_text(chinese, encoding="utf-8")
          PY
          git show origin/main:tests/test_update_skill.py > tests/test_update_skill.py

      - name: Validate preservation contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_skill.py scripts/mapcore/version.py \
            tests/test_update_skill.py tests/test_update_hotfix.py
          git diff --quiet origin/main -- tests/test_update_skill.py
          test -f tests/test_update_hotfix.py
          python - <<'PY'
          import subprocess
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          assert changelog.count("## [0.4.3]") == 1
          assert "## [0.4.2]" in changelog
          assert "## [0.1.0]" in changelog
          assert "The current stable release is **v0.4.3**." in Path("README.md").read_text(encoding="utf-8")
          assert "当前稳定版本为 **v0.4.3**。" in Path("README.zh-CN.md").read_text(encoding="utf-8")

          numstat = subprocess.check_output(
              ["git", "diff", "--numstat", "origin/main", "--", "CHANGELOG.md"],
              text=True,
          ).strip().split()
          if len(numstat) != 3 or int(numstat[1]) != 0:
              raise SystemExit(f"CHANGELOG history was not preserved: {numstat}")
          PY

      - name: Commit refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md README.zh-CN.md tests/test_update_skill.py
          git commit -m "test: preserve update history and legacy coverage"
          git push origin HEAD:hotfix/v0.4.3-update-preflight
