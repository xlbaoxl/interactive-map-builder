name: v044-fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: v044-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      validation_status: ${{ steps.validation.outputs.status }}
      validation_failure: ${{ steps.validation.outputs.failure }}
      commit_status: ${{ steps.commit.outputs.status }}
      commit_failure: ${{ steps.commit.outputs.failure }}
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v6
        with:
          ref: agent/v0.4.4-engineering-stabilization
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Repair verification and version-safe tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          map_builder = Path("scripts/map_builder.py")
          lines = map_builder.read_text(encoding="utf-8").splitlines()
          broken = [
              '        raise BuildError("Verification failed:',
              '- " + "',
              '- ".join(errors))',
          ]
          replacement = ['        raise BuildError("Verification failed:\\n- " + "\\n- ".join(errors))']
          matches = []
          for index in range(len(lines) - len(broken) + 1):
              if lines[index:index + len(broken)] == broken:
                  matches.append(index)
          if len(matches) != 1:
              raise SystemExit(f"Expected one broken verification literal, found {len(matches)}")
          index = matches[0]
          lines[index:index + len(broken)] = replacement
          map_builder.write_text("\n".join(lines) + "\n", encoding="utf-8")

          skill_test = Path("tests/test_skill_structure.py")
          text = skill_test.read_text(encoding="utf-8")
          if "import json\n" not in text:
              text = text.replace("import struct\n", "import json\nimport struct\n", 1)
          old = '    assert \'"schema_version": {"const": "1.1"}\' in schema\n'
          new = '    assert json.loads(schema)["properties"]["schema_version"]["const"] == "1.1"\n'
          if text.count(old) != 1:
              raise SystemExit("Could not replace brittle schema text assertion")
          skill_test.write_text(text.replace(old, new, 1), encoding="utf-8")

          update_test = Path("tests/test_update_skill.py")
          text = update_test.read_text(encoding="utf-8")
          old = '    session = FakeSession(_release("0.4.4"))\n'
          new = (
              '    major, minor, patch = parse_version(update_skill.__version__)\n'
              '    newer = f"{major}.{minor}.{patch + 1}"\n'
              '    session = FakeSession(_release(newer))\n'
          )
          if text.count(old) != 1:
              raise SystemExit("Could not replace hard-coded update test release")
          text = text.replace(old, new, 1)
          old = '    assert first["latest_version"] == "0.4.4"\n'
          new = '    assert first["latest_version"] == newer\n'
          if text.count(old) != 1:
              raise SystemExit("Could not replace hard-coded update test assertion")
          update_test.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile scripts/map_builder.py tests/test_skill_structure.py tests/test_update_skill.py

      - name: Validate repaired source
        id: validation
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            python -m pip install --quiet --upgrade pip
            python -m pip install --quiet -r requirements-dev.txt
            python scripts/evaluate_triggers.py validate
            python -m pytest -q -m "not browser"
            python -m build --wheel
            python scripts/build_skill_package.py
            python scripts/cli.py doctor
          ) > /tmp/v044-fix-validation.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          FAILURE=$(tail -40 /tmp/v044-fix-validation.log | base64 -w0)
          echo "failure=$FAILURE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v044-fix-validation
          path: /tmp/v044-fix-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified repairs
        id: commit
        if: steps.validation.outputs.status == '0'
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            git config user.name "openai-agent"
            git config user.email "openai-agent@users.noreply.github.com"
            git add scripts/map_builder.py tests/test_skill_structure.py tests/test_update_skill.py
            git diff --cached --check
            git commit -m "Fix v0.4.4 verification and version-safe tests"
            git push origin HEAD:agent/v0.4.4-engineering-stabilization
          ) > /tmp/v044-fix-commit.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          FAILURE=$(tail -40 /tmp/v044-fix-commit.log | base64 -w0)
          echo "failure=$FAILURE" >> "$GITHUB_OUTPUT"
          exit 0

  report-validation-failure:
    needs: fix
    if: needs.fix.outputs.validation_status != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Print exact validation failure
        shell: bash
        env:
          FAILURE: ${{ needs.fix.outputs.validation_failure }}
        run: |
          echo "$FAILURE" | base64 --decode
          exit 1

  report-commit-failure:
    needs: fix
    if: needs.fix.outputs.validation_status == '0' && needs.fix.outputs.commit_status != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Print exact commit failure
        shell: bash
        env:
          FAILURE: ${{ needs.fix.outputs.commit_failure }}
        run: |
          echo "$FAILURE" | base64 --decode
          exit 1
