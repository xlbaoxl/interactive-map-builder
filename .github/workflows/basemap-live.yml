name: Live basemap acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/mapcore/basemaps.py'
      - 'scripts/mapcore/resources/templates/basemap-layer.js'
      - 'scripts/mapcore/resources/templates/shared.js'
      - 'scripts/mapcore/resources/vendor/maplibre*/**'
      - 'scripts/check_live_basemaps.py'
      - '.github/workflows/basemap-live.yml'
permissions:
  contents: read
jobs:
  live-file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Load real providers in local-file Chromium and reopen downloaded snapshots
        run: python scripts/check_live_basemaps.py --out "$RUNNER_TEMP/live-basemaps"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-basemap-acceptance
          path: ${{ runner.temp }}/live-basemaps/
          retention-days: 7
