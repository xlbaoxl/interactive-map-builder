name: release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to repair, for example v0.4.4"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.tag }}
    steps:
      - name: Check out the verified commit or existing repair tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read and validate the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          TAG="v$VERSION"
          grep -F "## [$VERSION]" CHANGELOG.md
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ inputs.tag }}" = "$TAG"
            git rev-parse "$TAG" >/dev/null 2>&1
            test "$(git rev-list -n 1 "$TAG")" = "${{ steps.identity.outputs.sha }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Inspect existing tag and Release
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_SHA="${{ steps.identity.outputs.sha }}"
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "Existing $TAG points to $TAG_SHA instead of verified commit $RELEASE_SHA." >&2
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual runs may repair only an existing tag." >&2
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          MISSING=0
          grep -Fxq "interactive-map-builder-skill-v${VERSION}.zip" <<<"$ASSETS" || MISSING=1
          grep -Fxq "SHA256SUMS.txt" <<<"$ASSETS" || MISSING=1
          grep -Eq '\.whl$' <<<"$ASSETS" || MISSING=1
          grep -Eq '\.tar\.gz$' <<<"$ASSETS" || MISSING=1

          if [ "$MISSING" -eq 0 ]; then
            echo "state=complete" >> "$GITHUB_OUTPUT"
          else
            echo "state=incomplete" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release assets
        if: steps.existing.outputs.state != 'complete'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build
          python scripts/build_skill_package.py \
            --output "dist/interactive-map-builder-skill-v${{ steps.version.outputs.version }}.zip"
          (cd dist && sha256sum *.whl *.tar.gz "interactive-map-builder-skill-v${{ steps.version.outputs.version }}.zip" > SHA256SUMS.txt)

      - name: Create GitHub Release
        if: steps.existing.outputs.state == 'missing'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.whl \
            dist/*.tar.gz \
            "dist/interactive-map-builder-skill-v${{ steps.version.outputs.version }}.zip" \
            dist/SHA256SUMS.txt \
            --target "${{ steps.identity.outputs.sha }}" \
            --title "Interactive Map Builder v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest

      - name: Repair incomplete GitHub Release
        if: steps.existing.outputs.state == 'incomplete'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ steps.version.outputs.tag }}" \
            dist/*.whl \
            dist/*.tar.gz \
            "dist/interactive-map-builder-skill-v${{ steps.version.outputs.version }}.zip" \
            dist/SHA256SUMS.txt \
            --clobber
          gh release edit "${{ steps.version.outputs.tag }}" --latest

      - name: Verify final Release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          grep -Fxq "interactive-map-builder-skill-v${VERSION}.zip" <<<"$ASSETS"
          grep -Fxq "SHA256SUMS.txt" <<<"$ASSETS"
          grep -Eq '\.whl$' <<<"$ASSETS"
          grep -Eq '\.tar\.gz$' <<<"$ASSETS"
