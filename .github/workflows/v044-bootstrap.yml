name: bootstrap-v044

on:
  push:
    branches:
      - agent/v0.4.4-engineering-stabilization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-v044-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.patch.outputs.status }}
      failure: ${{ steps.patch.outputs.failure }}
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v6
        with:
          ref: agent/v0.4.4-engineering-stabilization
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Reconstruct stabilization script
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v044_payload/part*.txt | base64 --decode | gzip --decompress > tools/v044_stabilize.py
          python -m py_compile tools/v044_stabilize.py

      - name: Apply stabilization payload
        id: patch
        shell: bash
        run: |
          set +e
          python tools/v044_stabilize.py > /tmp/v044-apply.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          FAILURE=$(tail -80 /tmp/v044-apply.log | base64 -w0)
          echo "failure=$FAILURE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install and validate
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python scripts/evaluate_triggers.py validate
          python -m pytest -q -m "not browser"
          python -m build --wheel
          python scripts/build_skill_package.py

      - name: Commit verified source changes
        if: github.event_name == 'push' && steps.patch.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/v044_payload
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release v0.4.4: stabilize delivery and release boundaries"
          git push origin HEAD:agent/v0.4.4-engineering-stabilization

  report-failure:
    needs: apply
    if: needs.apply.outputs.status != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Print exact patch failure
        shell: bash
        env:
          FAILURE: ${{ needs.apply.outputs.failure }}
        run: |
          echo "$FAILURE" | base64 --decode
          exit 1
