name: bootstrap-v044

on:
  push:
    branches:
      - agent/v0.4.4-engineering-stabilization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-v044-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      patch_status: ${{ steps.patch.outputs.status }}
      patch_failure: ${{ steps.patch.outputs.failure }}
      validation_status: ${{ steps.validation.outputs.status }}
      validation_failure: ${{ steps.validation.outputs.failure }}
      commit_status: ${{ steps.commit.outputs.status }}
      commit_failure: ${{ steps.commit.outputs.failure }}
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v6
        with:
          ref: agent/v0.4.4-engineering-stabilization
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Reconstruct stabilization script
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v044_payload/part*.txt | base64 --decode | gzip --decompress > tools/v044_stabilize.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/v044_stabilize.py")
          text = path.read_text(encoding="utf-8")
          corrections = {
              '    "tests/test_examples.py",\n    \'        "README_USAGE.md",\\n\',':
              '    "tests/test_cli_integration.py",\n    \'        "README_USAGE.md",\\n\',',
              'replace_all("SKILL.md", "update --auto --force", "update --preflight", minimum=2)':
              'replace_all("SKILL.md", "--auto --force", "--preflight", minimum=2)',
          }
          for old, new in corrections.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Could not apply bootstrap correction: {old[:80]}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile tools/v044_stabilize.py

      - name: Apply stabilization payload
        id: patch
        shell: bash
        run: |
          set +e
          python tools/v044_stabilize.py > /tmp/v044-apply.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          FAILURE=$(tail -80 /tmp/v044-apply.log | base64 -w0)
          echo "failure=$FAILURE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install and validate
        id: validation
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          set +e
          {
            python -m pip install --upgrade pip
            python -m pip install -r requirements-dev.txt
            python scripts/evaluate_triggers.py validate
            python -m pytest -q -m "not browser"
            python -m build --wheel
            python scripts/build_skill_package.py
          } > /tmp/v044-validation.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          FAILURE=$(tail -160 /tmp/v044-validation.log | base64 -w0)
          echo "failure=$FAILURE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit verified non-workflow changes
        id: commit
        if: steps.patch.outputs.status == '0' && steps.validation.outputs.status == '0'
        shell: bash
        run: |
          set +e
          {
            rm -rf tools/v044_payload
            git checkout HEAD -- \
              .github/workflows/ci.yml \
              .github/workflows/release.yml \
              .github/workflows/v044-bootstrap.yml
            git config user.name "openai-agent"
            git config user.email "openai-agent@users.noreply.github.com"
            git add -A
            git diff --cached --check
            git commit -m "Release v0.4.4: stabilize delivery and release boundaries"
            git push origin HEAD:agent/v0.4.4-engineering-stabilization
          } > /tmp/v044-commit.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          FAILURE=$(tail -120 /tmp/v044-commit.log | base64 -w0)
          echo "failure=$FAILURE" >> "$GITHUB_OUTPUT"
          exit 0

  report-patch-failure:
    needs: apply
    if: needs.apply.outputs.patch_status != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Print exact patch failure
        shell: bash
        env:
          FAILURE: ${{ needs.apply.outputs.patch_failure }}
        run: |
          echo "$FAILURE" | base64 --decode
          exit 1

  report-validation-failure:
    needs: apply
    if: needs.apply.outputs.patch_status == '0' && needs.apply.outputs.validation_status != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Print exact validation failure
        shell: bash
        env:
          FAILURE: ${{ needs.apply.outputs.validation_failure }}
        run: |
          echo "$FAILURE" | base64 --decode
          exit 1

  report-commit-failure:
    needs: apply
    if: needs.apply.outputs.patch_status == '0' && needs.apply.outputs.validation_status == '0' && needs.apply.outputs.commit_status != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Print exact commit failure
        shell: bash
        env:
          FAILURE: ${{ needs.apply.outputs.commit_failure }}
        run: |
          echo "$FAILURE" | base64 --decode
          exit 1
