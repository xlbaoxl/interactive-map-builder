name: finalize-v060
on:
  push:
    branches: [agent/release-v0.6.0]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'xlbaoxl/interactive-map-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 264eb010334acfc49c90678bab3a2b4de1a0db78
          persist-credentials: false
      - name: Align existing status copy and prepare verified blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          changes = [
            ('README.md', '## Current release: v0.6.0\n', '## Quick start\n', '## Project status\n\n',
             'The current stable release is **v0.6.0**. It combines leaner command startup,\nintent-resolved first builds, and portable **Share view** HTML/JSON handoff. Existing local\nSaved Views remain available; MapSpec stays at 1.1 and both template families are unchanged.\nRebuild existing maps to add the sharing control. For fresh installations that read Excel,\ninstall `.[excel]`; existing readers remain usable.\nSee [release notes](https://github.com/xlbaoxl/interactive-map-builder/releases/tag/v0.6.0).'),
            ('README.zh-CN.md', '## 当前版本：v0.6.0\n', '## 快速开始\n', '## 项目状态\n\n',
             '当前稳定版本为 **v0.6.0**。本版整合命令启动优化、明确意图直接构建和“分享当前视图”\nHTML／JSON 交付。原有本地保存视角继续可用；MapSpec 保持 1.1，两种既有模板不变。\n已有地图需重新构建才能获得分享入口；全新安装需要读取 Excel 时安装 `.[excel]`，已安装的\n读取器继续有效。详见[正式发布说明](https://github.com/xlbaoxl/interactive-map-builder/releases/tag/v0.6.0)。')
          ]
          paths = []
          for name, start, end, status, replacement in changes:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              assert text.count(start) == text.count(end) == text.count(status) == 1
              a, b = text.index(start), text.index(end)
              text = text[:a] + text[b:]
              a = text.index(status) + len(status)
              b = text.index('\n\n', a)
              text = text[:a] + replacement + text[b:]
              assert '**v0.5.1**' not in text
              path.write_text(text, encoding='utf-8')
              paths.append(name)
          path = Path('tests/test_distribution.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert project_version() == __version__\n'
          assert text.count(old) == 1
          text = text.replace(old, old + '    assert f"The current stable release is **v{__version__}**" in (ROOT / "README.md").read_text(encoding="utf-8")\n    assert f"当前稳定版本为 **v{__version__}**" in (ROOT / "README.zh-CN.md").read_text(encoding="utf-8")\n')
          path.write_text(text, encoding='utf-8')
          paths.append(str(path))
          subprocess.run(['git','add','--',*paths], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          output = Path(os.environ['RUNNER_TEMP']) / 'imb-release-copy'
          output.mkdir()
          entries = []
          for name in paths:
              data = Path(name).read_bytes()
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == subprocess.check_output(['git','hash-object',name]).decode().strip()
              entries.append({'path':name,'mode':'100644','type':'blob','sha':result['sha']})
              target = output / name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          tree = subprocess.check_output(['git','write-tree']).decode().strip()
          (output/'candidate.json').write_text(json.dumps({'tree':tree,'entries':entries},indent=2))
          print('CANDIDATE=' + json.dumps({'tree':tree,'entries':entries}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imb-release-copy
          path: ${{ runner.temp }}/imb-release-copy/
          retention-days: 1
