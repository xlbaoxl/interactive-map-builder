name: apply v0.4.1 contracts

on:
  push:
    branches:
      - agent/v0.4.1-contract-and-overview
    paths:
      - ".github/workflows/apply-v041.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v041:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.4.1-contract-and-overview
          fetch-depth: 0
      - name: Apply reviewed v0.4.1 product patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/v041-patch/part-* > /tmp/v041.b64
          test "$(wc -c < /tmp/v041.b64)" = "44780"
          echo "45ca79100f7c88390798e270b52a8e7bf2614f6f8751630c068068dc6efa76e7  /tmp/v041.b64" | sha256sum -c -
          base64 -d /tmp/v041.b64 > /tmp/v041.gz
          echo "cf7d4a01115420652e1c354b52a18e0fedecae67824e354391e56551208ea441  /tmp/v041.gz" | sha256sum -c -
          gzip -dc /tmp/v041.gz > /tmp/v041.patch
          echo "73d9a575e738b2a58b188ed1ff66cc706f0f42d23136b1e36ba8a53faa861c63  /tmp/v041.patch" | sha256sum -c -
          git apply --check --index --binary /tmp/v041.patch
          git apply --index --binary /tmp/v041.patch
      - name: Validate staged product tree
        shell: bash
        run: |
          set -euxo pipefail
          git diff --cached --check
          test "$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )" = "0.4.1"
          test -f tests/test_readme_screenshots.py
          test ! -e .github/workflows/source-snapshot-v041.yml
      - name: Remove patch staging files and publish product commit
        shell: bash
        run: |
          set -euxo pipefail
          git rm -r .github/v041-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: prepare v0.4.1 overview and delivery contracts"
          git push origin HEAD:agent/v0.4.1-contract-and-overview
