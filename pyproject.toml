[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-map-builder"
version = "0.5.0"
description = "Turn existing spatial data into verified interactive maps and report-ready figures with AI agents."
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "agent-skills",
  "codex",
  "claude-code",
  "geospatial",
  "interactive-maps",
  "leaflet",
]
dependencies = [
  "geopandas>=0.12.2,<2",
  "pandas>=1.4.4,<3",
  "numpy>=1.23,<3",
  "shapely>=2.0,<3",
  "pyogrio>=0.7,<1",
  "Jinja2>=3.0,<4",
  "matplotlib>=3.6,<4",
  "openpyxl>=3.0,<4",
  "xlrd>=2.0,<3",
  "requests>=2.28,<3",
  "jsonschema>=4.16,<5",
]

[project.urls]
Homepage = "https://xlbaoxl.github.io/interactive-map-builder/"
Documentation = "https://github.com/xlbaoxl/interactive-map-builder#readme"
Repository = "https://github.com/xlbaoxl/interactive-map-builder"
Changelog = "https://github.com/xlbaoxl/interactive-map-builder/blob/main/CHANGELOG.md"
Issues = "https://github.com/xlbaoxl/interactive-map-builder/issues"

[project.scripts]
interactive-map-builder = "cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["cli", "map_builder", "update_skill"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["mapcore*"]

[tool.setuptools.package-data]
mapcore = [
  "resources/*.json",
  "resources/locales/*.json",
  "resources/templates/*.j2",
  "resources/templates/*.css",
  "resources/templates/*.js",
  "resources/vendor/leaflet-1.9.4/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: Chromium smoke tests that require Playwright and an installed browser",
]
