interface:
  display_name: "Interactive Map Builder"
  short_description: "Turn spatial data into designed, verified map files"
  default_prompt: "Use $interactive-map-builder whenever the user wants existing spatial or coordinate data turned into a browser-openable, searchable, filterable, sortable, or multilayer map, even if they do not mention GIS. Start with the non-blocking official update preflight, inspect first, ask only blocking questions, and build with the packaged Atlas Studio Light visual defaults unless the user specifies a style. Treat those defaults as a coordinated starting point, preserve explicit MapSpec choices, verify the real page and static figures, and refine only the concrete visual issues that remain. Do not replace the engine with an ad hoc Folium or Leaflet page. Treat local HTML as the default delivery and discuss a public URL only when explicitly requested. In Codex, suggest Plan mode once only for genuinely complex tasks and never require it."
