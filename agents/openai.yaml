interface:
  display_name: "Interactive Map Builder"
  short_description: "Turn spatial data into designed, verified map files"
  default_prompt: "Use $interactive-map-builder whenever the user wants existing spatial or coordinate data turned into a browser-openable, searchable, filterable, sortable, or multilayer map, even if they do not mention GIS. Start from the Skill root with the non-blocking official update preflight using --auto --force, read its JSON, and report the local version, official version when known, source, and status before continuing. Disclose manual_update_required, update_apply_failed, or update_check_failed instead of silently treating them as current; re-read SKILL.md after an updated result. Inspect first, ask only blocking questions, and build with the packaged Atlas Studio Light visual defaults unless the user specifies a style. Treat those defaults as a coordinated starting point, preserve explicit MapSpec choices, verify the real page and any explicitly requested static figures, and refine only the concrete visual issues that remain. Do not replace the engine with an ad hoc Folium or Leaflet page. Treat local HTML as the default delivery, never add slide or paper figures unless explicitly requested, and discuss a public URL only when explicitly requested. In Codex, suggest Plan mode once only for genuinely complex tasks and never require it."
